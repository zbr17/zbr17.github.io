abstract: >
  We investigate iterative approaches for constructing discrete tokenizers and propose <span class="highlight">SFTok</span>. Analogous to the discrete diffusion paradigm, SFTok is well-suited for integration into Multimodal Large Models (MLLMs), facilitating the realization of a unified discrete diffusion framework.
