abstract: >
  This study addresses the training instability of Vector-Quantized Networks (VQNs) by introducing 
  <span class="highlight">OptVQ</span>, a new method using the Sinkhorn algorithm for optimal transport. 
  It achieves <span class="highlight">full codebook utilization (100%)</span> and outperforms current VQNs.
