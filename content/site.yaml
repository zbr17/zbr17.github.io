about_me:
  - >
    I am a <strong>postdoctoral researcher at Tsinghua University</strong>, working with
    <a href="http://ivg.au.tsinghua.edu.cn/Jiwen_Lu/">Prof. Jiwen Lu</a> in the
    <a href="http://ivg.au.tsinghua.edu.cn/">i-VisionGroup</a>. I lead research in the
    <strong>Embodied Intelligence Systems Group</strong>, connecting advances in multimodal
    models with intelligent systems that perceive, reason, and act.
  - >
    I am also the <strong>co-founder and CEO of <a href="http://www.loopeva.com/">LoopEva</a></strong>.
    Across research and entrepreneurship, I am interested in making intelligence
    more understandable, efficient, and useful in the physical world.
  - >
    I received my Ph.D. in Control Science and Engineering from Tsinghua University in
    <strong>June 2026</strong>, advised by Prof. Jiwen Lu, and began my postdoctoral research
    in <strong>September 2026</strong> as a Shuimu Scholar. Previously, I received a B.E.
    in Automation and a second B.A. in Economics from Tsinghua University in 2021.

research_intro: >
  From the representations a model learns to the decisions a system makes,
  my research connects <strong>understanding</strong>, <strong>efficiency</strong>,
  and <strong>action</strong>.
research_areas:
  - title: "Embodied Intelligence & Multimodal Agents"
    label: "Perceive / reason / act"
    details:
      - "Multimodal reasoning, GUI grounding, and embodied intelligent systems."
      - "Connecting model capabilities with real-world perception and interaction."
  - title: "Efficient Models & Visual Representation"
    label: "Represent / train / deploy"
    details:
      - "Visual tokenization, vector quantization, and generative model pretraining."
      - "Efficient training and deployment of multimodal foundation models."
  - title: "Explainable Learning & Model Optimization"
    label: "Interpret / diagnose / improve"
    details:
      - "Mechanistic and axiomatic explanations of neural model behavior."
      - "Attribution, interpretable optimization, and reliable model decisions."

