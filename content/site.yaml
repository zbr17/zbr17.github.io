about_me: >
  I received my Ph.D. degree from the Department of Automation, Tsinghua University in 2026, where I was advised by 
  <a href="http://ivg.au.tsinghua.edu.cn/Jiwen_Lu/">Prof. Jiwen Lu</a> at the 
  <a href="http://ivg.au.tsinghua.edu.cn/">i-VisionGroup</a>. I will join Prof. Jiwen Lu's team as a postdoctoral researcher, 
  where I will coordinate two research groups focusing on on-device agents and embodied brain. I received my B.E. degree 
  from the Department of Automation and a second B.A. degree from the School of Economics and Management at Tsinghua University 
  in 2021. My research aims to build interpretable, efficient, and embodied large-scale intelligent systems.

research_intro: >
  My current research focuses on the principles, systems, and applications of large-scale intelligent models. In particular, I study 
  how to make large models more <strong>interpretable</strong>, <strong>lightweight</strong>, and <strong>agentic</strong>, with an emphasis on 
  connecting theoretical understanding with practical deployment in multimodal and embodied scenarios.
research_areas:
  - title: "Interpretability of Large Models"
    details:
      - "Mechanistic and axiomatic explanations for large neural models."
      - "Concept alignment, attribution, and interpretable model behaviors."
  - title: "Efficient and Lightweight Large Models"
    details:
      - "Efficient training, inference, compression, and visual tokenization."
      - "Deployment-oriented model design for resource-constrained environments."
  - title: "Multimodal Agents"
    details:
      - "GUI agents, embodied agents, and multimodal decision-making systems."
      - "Safety alignment and interpretable reasoning for agentic models."

