<article class="paper">
  <a class="paper-image" href="{{ paper.links[0].url }}" aria-label="Read {{ paper.title }}">
    <img src="{{ paper.image }}" alt="Overview of {{ paper.title }}" loading="lazy" decoding="async">
  </a>
  <div class="paper-body">
    <p class="paper-meta"><span class="venue-badge">{{ paper.venue }}</span><span>{{ paper.year }}</span></p>
    <h3 class="paper-title"><a href="{{ paper.links[0].url }}">{{ paper.title }}</a></h3>
    <p class="authors">{{ authors(paper.authors) }}</p>
    <p class="abstract">{{ paper.abstract | safe }}</p>
    {{ link_list(paper.links, "paper-links", "Resources for " ~ paper.title) }}
  </div>
</article>
